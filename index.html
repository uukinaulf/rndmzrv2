<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rndmzr — index link bermanfaat</title>
<meta name="description" content="Kumpulan link berguna untuk developer: tools, belajar, desain, AI, infra, data, keamanan, produktivitas.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#101216">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#grid">Lewati ke daftar link</a>

<div class="bg" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span><span class="grid-lines"></span></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1L11.7 4.2"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.3-1.3"/></svg></span>
      <span class="brand-text">rndmzr<em>/links</em></span>
    </a>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Ganti tema" title="Ganti tema (T)">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn-outline" href="https://github.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.7.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7 1 .7 2v2.9c0 .3.2.6.7.5A10.3 10.3 0 0 0 22 12.2C22 6.6 17.5 2 12 2z"/></svg>
        <span>Kontribusi</span>
      </a>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <div class="hero-row">
      <div>
        <p class="eyebrow"><span class="dot"></span><span id="totalCount">0</span> link · <span id="catCount">0</span> kategori</p>
        <h1>Link <span class="grad">layak simpan</span></h1>
        <p class="lede">Tools, sumber belajar, referensi yang benar-benar dipakai. Tanpa iklan, tanpa noise.</p>
        <div class="search">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Cari link, tag, atau kategori…" autocomplete="off" spellcheck="false" aria-label="Cari link" aria-controls="grid">
          <kbd class="hint-key">/</kbd>
          <button id="clearBtn" class="clear-btn" type="button" aria-label="Bersihkan pencarian" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="filters" role="group" aria-label="Filter kategori">
          <div id="chips" class="chips"></div>
          <label class="toggle"><input id="favOnly" type="checkbox"><span>Favorit</span></label>
        </div>
      </div>
    </div>
  </section>

  <section class="wrap">
    <div class="result-bar">
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>

    <ul id="grid" class="grid"></ul>

    <div id="empty" class="empty" hidden>
      <p></p>
      <button id="resetBtn" class="btn-outline" type="button">Reset filter</button>
    </div>
  </section>
</main>

<footer class="wrap footer" style="margin-top:72px;padding-block:28px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--fg-dim)">
  <p>Dibuat manual. Tiap link pernah dipakai minimal sekali.</p>
  <p class="mono">Ctrl/⌘ + K cari · T tema</p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
